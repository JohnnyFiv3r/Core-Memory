why = "A stated, untested possibility."

[[read]]
id = "R08"
probe = "hedge"
text = "Confirmed: the leak was the image cache. Heap stays flat with it disabled."
expect = ["outcome", "observation"]
why = "A confirmed finding, no longer a hypothesis."

[[read]]
id = "R09"
probe = "hedge"
text = "Maybe we should try Postgres instead of SQLite?"

why = "A suggestion put as a question. No type describes a proposal, and it decides nothing."

[[read]]
id = "R10"
probe = "hedge"
text = "Let's go with Postgres. I'll set up the migration tomorrow."
expect = ["decision"]
why = "A choice made, with a commitment."


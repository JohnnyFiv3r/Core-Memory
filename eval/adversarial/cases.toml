# Hard cases for the reader and the judge, with the answers we count as
# right. All the text is ours, written for this test.
#
# [[read]]: one message, read alone. `expect` lists the types that are right;
# "abstain" stands for any of the reader's abstentions. `not` lists types
# that are wrong, when anything else may be right.
#
# [[thread]]: a short conversation the judge reads. `at` is minutes after the
# thread starts. A message may also carry `expect` for its type. Each
# [[thread.pair]] names two messages, a and b, and the answers that are
# right for them, each one of:
#   an arrow, named so that "a <arrow> b" is true: `repl` (a replaces b),
#     `repl-by` (a is replaced by b), `withdraws`, `cause`, `result`,
#     `confirms`, `answers`, `same-memory`, `!contradicts`, ... as the
#     engine's arrow directory names them
#   a type, near, leadsto, contains or express: any arrow of it, either
#     way, but a negative one (`!confuse`, `!contradicts`), which is only
#     ever an answer by its own name
#   ends: an arrow that replaces or withdraws, either way
#   none, unsure
# A pair may give `not` in place of `expect`: any answer but these is right.
# `names` lists name pairs that should be linked as one entity, and
# `no_name` names that should be linked to nothing.

# ---------------------------------------------------------------------------
# The reader
# ---------------------------------------------------------------------------

# Sarcasm: what is said is not what is meant.

[[read]]
id = "R01"
probe = "sarcasm"
text = "Oh great, another rejection letter. Exactly what I needed this week."
expect = ["outcome", "observation"]
why = "It reports a rejection. \"Great\" is sarcasm, not a preference."

[[read]]
id = "R02"
probe = "sarcasm"
text = "Love how the build breaks every time I touch the README. Really fantastic engineering."
expect = ["observation", "incident"]
why = "A complaint about a recurring breakage, not a preference."

[[read]]
id = "R03"
probe = "sarcasm"
text = "Sure, let's ship it on Friday at 5pm, what could possibly go wrong."
expect = ["abstain", "observation"]
why = "A sarcastic objection to a proposal. It decides nothing."

[[read]]
id = "R04"
probe = "sarcasm"
text = "Wow, thanks for the 'quick' 3-hour meeting."
expect = ["observation", "abstain"]
why = "Sarcastic thanks: a complaint that the meeting ran three hours, not a thank-you."

# Hedges: a possibility, an intention and a choice made.


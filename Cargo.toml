[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/JohnnyFiv3r/Core-Memory"
homepage = "https://github.com/JohnnyFiv3r/Core-Memory"
authors = ["John Inniger"]
publish = false

[workspace.dependencies]
core-memory-contract = { path = "crates/core-memory-contract", version = "=2.0.0-alpha.1" }
core-memory-chunker = { path = "crates/core-memory-chunker", version = "=2.0.0-alpha.1" }
core-memory-core = { path = "crates/core-memory-core", version = "=2.0.0-alpha.1" }
core-memory-store-sqlite = { path = "crates/core-memory-store-sqlite", version = "=2.0.0-alpha.1" }
core-memory-source-jsonl = { path = "crates/core-memory-source-jsonl", version = "=2.0.0-alpha.1" }
core-memory-sink-jsonl = { path = "crates/core-memory-sink-jsonl", version = "=2.0.0-alpha.1" }

clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hmac = "0.13"
proptest = "1.12"
regex = "1.13"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = { version = "1.2", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_json_canonicalizer = "0.4"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
toml = "0.9"
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["serde", "v8"] }
whatlang = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

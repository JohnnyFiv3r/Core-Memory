[package]
name = "core-memory"
description = "Core Memory: turns event streams into durable, auditable memory records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
readme = "../../README.md"

[features]
default = ["postgres", "jsonl"]
# The PostgreSQL store: client, TLS and migrations.
postgres = ["dep:core-memory-store-postgres"]
jsonl = ["dep:core-memory-source-jsonl"]

[dependencies]
core-memory-chunker.workspace = true
core-memory-contract.workspace = true
core-memory-core.workspace = true
core-memory-source-jsonl = { workspace = true, optional = true }
core-memory-store-postgres = { workspace = true, optional = true }

[lints]
workspace = true

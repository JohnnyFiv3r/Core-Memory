name: rust

on:
  push:
    branches: ["next", "master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy (1.99), layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new stable release cannot fail a PR with new lints.
      # Bump deliberately, together with any fixes it needs.
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python3 scripts/check_layering.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  memoriesql:
    name: memoriesQL conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: synthetic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # memoriesQL at the commit that adds schema 54, engine record intake.
      # Bump deliberately: this pins what the memoriesQL sink is proven against.
      MEMORIESQL_REF: 22be747881e854f36da83ac344a16782425cc4f8
      CORE_MEMORY_TEST_MEMORIESQL_URL: postgresql://postgres:synthetic@127.0.0.1:5432/postgres
      CORE_MEMORY_TEST_MEMORIESQL_TEMPLATE: memoriesql_template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "memoriesql @ git+https://github.com/JohnnyFiv3r/memoriesql@${MEMORIESQL_REF}"
      - name: Migrate a memoriesQL template database to schema 54
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg.conninfo import make_conninfo
          from memoriesql.infrastructure.postgres.migration_runner import migrate
          admin = os.environ["CORE_MEMORY_TEST_MEMORIESQL_URL"]
          name = os.environ["CORE_MEMORY_TEST_MEMORIESQL_TEMPLATE"]
          with psycopg.connect(admin, autocommit=True) as connection:
              connection.execute(f"CREATE DATABASE {name}")
          with psycopg.connect(make_conninfo(admin, dbname=name), autocommit=True) as connection:
              print(migrate(connection, expected_current_version=0, target_version=54).to_version)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p core-memory-sink-memoriesql --features postgres-tests --locked

name: architecture-guards

on:
  push:
    branches: ["**"]
    paths:
      - "core_memory/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - "scripts/check_architecture_guards.py"
      - "scripts/check_test_suite_health.py"
      - "scripts/architecture_guards_baseline.json"
      - "scripts/compat_surface_usage_baseline.json"
      - "tests/test_architecture_guards.py"
      - "tests/test_test_suite_health_guard.py"
      - ".github/workflows/architecture-guards.yml"
  pull_request:
    paths:
      - "core_memory/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "pyproject.toml"
      - "scripts/check_architecture_guards.py"
      - "scripts/check_test_suite_health.py"
      - "scripts/architecture_guards_baseline.json"
      - "scripts/compat_surface_usage_baseline.json"
      - "tests/test_architecture_guards.py"
      - "tests/test_test_suite_health_guard.py"
      - ".github/workflows/architecture-guards.yml"

jobs:
  guardrails:
    name: "architecture guardrails"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run architecture guard
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            ratchet_ref="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ratchet_ref="$BEFORE_SHA"
          else
            ratchet_ref="HEAD^"
          fi
          python scripts/check_architecture_guards.py \
            --baseline scripts/architecture_guards_baseline.json \
            --ratchet-ref "$ratchet_ref" \
            --fail-on-new

      - name: Run compatibility surface usage guard
        run: python scripts/check_architecture_guards.py --compat-baseline scripts/compat_surface_usage_baseline.json --fail-on-new-compat

      - name: Run test suite health guard
        run: python scripts/check_test_suite_health.py --fail-on-violations

      - name: Run architecture guard tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/test_architecture_guards.py tests/test_test_suite_health_guard.py -q
